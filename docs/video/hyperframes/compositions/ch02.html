      <script>
        (function () {
          const D = {"dur": 33.766666666666666, "rings": [[0.2, 1.9], [8.7, 9.7], [14.733333333333333, 16.4], [22.166666666666668, 23.6], [23.7, 27.4], [23.7, 27.4], [28.3, 29.333333333333332], [29.4, 30.7], [30.9, 32.8]], "caps": [[0.0, 3.4], [3.4, 8.6], [8.6, 10.9], [10.9, 14.7], [14.7, 17.2], [17.2, 22.1], [22.1, 28.3], [28.3, 33.766666666666666]], "chips": [], "punches": [[2.9, 8.6, 1.8, -892.5, -61.4], [10.8, 14.7, 1.7, -220.6, -189.4], [17.0, 22.1, 1.8, -735.0, -378.0]], "first": false};
          const root = document.querySelector('[data-composition-id="ch02"]');
          const q = (s) => root.querySelectorAll(s);
          const tl = gsap.timeline({ paused: true });
          if (D.first) tl.fromTo("#ch02-frame", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
          // subtítulos: sube y entra (waterfall-entry contenido), sale rápido
          q(".caption").forEach((el, i) => {
            const [a, b] = D.caps[i];
            tl.fromTo(el, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, a + 0.05);
            if (b - a > 1.2 && b < D.dur - 0.05) tl.to(el, { opacity: 0, duration: 0.2, ease: "power1.in" }, b - 0.2);
          });
          q(".chip").forEach((el, i) => {
            const [a] = D.chips[i];
            tl.fromTo(el, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, a + 0.05);
          });
          // anillos de resaltado sobre la UI real
          q(".ring").forEach((el, i) => {
            const [a, b] = D.rings[i];
            tl.fromTo(el, { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, a);
            const pulses = Math.max(0, Math.floor((b - a - 0.9) / 0.5));
            if (pulses > 0) tl.to(el, { scale: 1.05, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: pulses - 1 }, a + 0.45);
            tl.to(el, { opacity: 0, duration: 0.25 }, b - 0.25);
          });
          // punch-ins (viewport-change: un solo envoltorio con escala + traslación)
          D.punches.forEach(([a, b, s, x, y]) => {
            tl.fromTo("#ch02-cam", { scale: 1, x: 0, y: 0 }, { scale: s, x: x, y: y, duration: 0.9, ease: "power3.inOut", immediateRender: false }, a);
            tl.to("#ch02-cam", { scale: 1, x: 0, y: 0, duration: 0.45, ease: "power2.inOut" }, b - 0.45);
          });
          window.__timelines["ch02"] = tl;
        })();
