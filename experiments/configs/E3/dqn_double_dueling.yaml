# E3 ablacion: + Dueling
exp: E3
algo: dqn
name: dqn_double_dueling
scenario: cruce_pico
seed: 0            # train.py lo sobreescribe con --seed (5 semillas en Colab)
total_episodes: 100   # 100 x 720 pasos = 72 000 pasos de entorno (igual para todos)
num_seconds: 3600
hparams:
  double: true
  dueling: true
  per: false
  lr: 0.001
  buffer_size: 50000
  batch_size: 64
  target_update: 500
  eps_start: 1.0
  eps_end: 0.05
  eps_fraction: 0.5
  gamma: 0.99
  learning_starts: 1000
  train_freq: 1
  hidden: 64
  obs_norm: false
  device: auto
eval: {scenarios: [cruce_pico, cruce_mediodia], every_episodes: 10, episodes: 3}
